name: gnucobol-pgsql
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gcobpg
      POSTGRES_USER: gcob
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcob -d gcobpg"]
      interval: 3s
      timeout: 3s
      retries: 20

secrets:
  pg_password:
    file: ./secrets/password.txt

volumes:
  pg-data:
