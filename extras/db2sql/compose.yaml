name: gnucobol-db2
services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    hostname: gnucobol-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:?Set DB2INST1_PASSWORD in .env}
      DBNAME: GCOBDB
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "true"
    ports:
      - "127.0.0.1:${DB2_HOST_PORT:-50001}:50000"
    volumes:
      - db2-data:/database

volumes:
  db2-data:
