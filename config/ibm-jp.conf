# IBM COBOL with data in Japanese EBCDIC (EXPERIMENTAL),
# see docs/proposal/ebcdic-internal-encoding-ja.md

include "ibm.conf"

# Value: any string
name: "IBM COBOL (lax), Japanese EBCDIC (CCSID 1399)"

# Character set of the data (EXPERIMENTAL), may be one of:
# native, IBM-037, IBM-930, IBM-939, IBM-1390, IBM-1399
data-codeset:			IBM-1399
