name: zOSPlus regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast-regression:
    name: Rust and preprocess (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup default stable
      - name: CICS/BMS host unit tests
        run: cargo test --locked --manifest-path extras/cobcics/Cargo.toml
      - name: JCL interpreter unit tests
        run: cargo test --locked --manifest-path extras/jclsh/Cargo.toml
      - name: Fixed-block converter unit tests
        run: cargo test --locked --manifest-path extras/jclsh/Cargo.toml --bin fbconvert
      - name: PL/I compiler unit tests
        run: cargo test --locked --manifest-path extras/pl1c/Cargo.toml
      - name: IMS DB unit tests
        run: cargo test --locked --manifest-path extras/imsdb/Cargo.toml
      - name: COBOL preprocess regression tests
        run: |
          python extras/cobcics/test_cics_preprocess.py
          python tests/test_db2sql_preprocess.py
          python tests/test_cobcov.py
          python tests/test_cics_genapp_preprocess.py
          python extras/imsdb/tests/test_execdli.py
      - name: Build release tools
        run: |
          cargo build --locked --release --manifest-path extras/cobcics/Cargo.toml --bins
          cargo build --locked --release --manifest-path extras/jclsh/Cargo.toml --bins
          cargo build --locked --release --manifest-path extras/pl1c/Cargo.toml
          cargo build --locked --release --manifest-path extras/imsdb/Cargo.toml
      - name: Package release tools as ZIP
        run: python extras/ci/package_rust_tools.py --os ${{ runner.os }}
      - name: Upload release tools ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/zosplus-tools-${{ runner.os }}.zip
          archive: false
          if-no-files-found: error
